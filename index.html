<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>RetroFM · Istanbul Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Share Tech Mono',monospace;background:#050302;display:flex;justify-content:center;align-items:center}
.radio-cabinet{width:95%;max-width:420px;background:linear-gradient(135deg,#3d1a08,#1a0a03);border:10px solid #0a0402;border-radius:28px;padding:18px;box-shadow:0 30px 70px rgba(0,0,0,.95),inset 0 0 40px rgba(0,0,0,.8);display:flex;flex-direction:column;gap:12px;position:relative}
.brass-badge{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:linear-gradient(to bottom,#f3e5ab,#b8860b);color:#0f0703;font-family:'Special Elite',cursive;font-size:.75rem;padding:2px 16px;border-radius:4px;border:2px solid #3d1a08;box-shadow:0 4px 8px rgba(0,0,0,.6);letter-spacing:2px}
.screen-box{background:#020802;border:3px solid #0d1f0f;border-radius:10px;padding:12px;text-align:center;box-shadow:inset 0 0 20px rgba(0,255,0,.2);display:flex;flex-direction:column;gap:8px}
.freq-display{font-size:2.2rem;color:#33ff33;text-shadow:0 0 12px rgba(51,255,51,.7)}
.station-display{font-size:.85rem;color:#ffb703;letter-spacing:1px}
.equalizer-container{display:flex;justify-content:center;align-items:flex-end;gap:4px;height:30px;background:#000;border-radius:4px;padding:4px;border:1px solid #112211}
.eq-bar{flex:1;max-width:12px;background:#113311;border-radius:2px;height:10%;transition:height .08s ease}
.eq-bar.active{background:linear-gradient(to top,#33ff33 60%,#ffff33 85%,#ff3333 100%);box-shadow:0 0 5px rgba(51,255,51,.5)}
.scale-container{width:100%;background:#120803;border:3px solid #2b180d;border-radius:8px;padding:10px 8px;position:relative;cursor:ew-resize;touch-action:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.9)}
.scale-bar{position:relative;height:20px;width:100%}.scale-line{position:absolute;top:9px;left:0;right:0;height:2px;background:#b8860b}
.scale-needle{position:absolute;top:0;width:3px;height:20px;background:#ff3333;box-shadow:0 0 8px #ff3333;transform:translateX(-50%);transition:left .05s linear;z-index:5}
.scale-labels{display:flex;justify-content:space-between;font-size:.55rem;color:#b09b85;margin-top:4px}
.controls-row{display:flex;justify-content:space-between;align-items:center;background:#120501;border:2px solid #2b180d;border-radius:10px;padding:10px 14px}
.power-btn{background:#4a3008;border:3px solid #f3e5ab;color:#f3e5ab;padding:8px 16px;border-radius:20px;font-family:inherit;font-weight:bold;font-size:.75rem;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.5);transition:.2s}
.power-btn.active{background:#1a520c;border-color:#33ff33;color:#33ff33;box-shadow:0 0 15px #33ff33}
.volume-control{display:flex;align-items:center;gap:8px;color:#b09b85;font-size:.7rem}
.volume-slider{-webkit-appearance:none;width:90px;height:6px;background:#2b180d;border-radius:3px;outline:none;border:1px solid #4a3008}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:linear-gradient(to bottom,#f3e5ab,#b8860b);cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.8)}
.status-text{font-size:.65rem;color:#a39171;text-align:center;min-height:15px}
.station-list{max-height:90px;overflow:auto;background:#0c0502;border:2px solid #2b180d;border-radius:8px;padding:5px}
.station-item{display:flex;justify-content:space-between;padding:3px 5px;color:#b09b85;font-size:.62rem}
.station-item.current{color:#33ff33;background:#102010}
</style>
</head>
<body>
<div class="radio-cabinet">
<div class="brass-badge">RETRO-FM v2.0</div>
<div class="screen-box">
<div class="freq-display" id="freqDisplay">100.0 MHz</div>
<div class="station-display" id="stationDisplay">RADYO KAPALI</div>
<div class="equalizer-container" id="eqContainer">
<div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
<div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
<div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
</div>
</div>
<div class="scale-container" id="scaleContainer">
<div class="scale-bar"><div class="scale-line"></div><div class="scale-needle" id="scaleNeedle" style="left:61%;"></div></div>
<div class="scale-labels"><span>87.5</span><span>92.0</span><span>96.0</span><span>100.0</span><span>104.0</span><span>108.0</span></div>
</div>
<div class="controls-row">
<button class="power-btn" id="powerBtn">GÜÇ: KAPALI</button>
<div class="volume-control"><span>SES</span><input type="range" id="volSlider" class="volume-slider" min="0" max="1" step=".05" value=".8"></div>
</div>
<div class="status-text" id="statusText">Güç düğmesine basarak radyoyu açın</div>
<div class="station-list" id="stationList"></div>
</div>

<audio id="audioPlayer" crossorigin="anonymous"></audio>

<script>
const PROXY_BASE="https://retro-proxy-pt9j.onrender.com/stream?channel=";

const stations=[

{freq:105.4,name:"Radyo Mega",key:null},{freq:105.6,name:"Baba Radyo",key:null},
{freq:105.8,name:"Radyo İmparator",key:null},{freq:106.0,name:"Pal Station",key:null},
{freq:106.2,name:"Virgin Radio",key:"virgin"},{freq:106.4,name:"RS FM",key:null},
{freq:106.6,name:"Pal Orient",key:null},{freq:106.8,name:"TRT World Radio",key:null},
{freq:107.0,name:"Radyo Seymen",key:null},{freq:107.2,name:"Radyo Spor",key:null},
{freq:107.4,name:"Radio Voyage",key:null},{freq:107.6,name:"Akra FM",key:null},
{freq:107.8,name:"Radyo Hevi",key:null},{freq:108.0,name:"Dolunay FM",key:null}
];

const minFreq=87.5,maxFreq=108;
let currentFreq=100,isPoweredOn=false;
const powerBtn=document.getElementById("powerBtn"),freqDisplay=document.getElementById("freqDisplay");
const stationDisplay=document.getElementById("stationDisplay"),statusText=document.getElementById("statusText");
const scaleContainer=document.getElementById("scaleContainer"),scaleNeedle=document.getElementById("scaleNeedle");
const volSlider=document.getElementById("volSlider"),audio=document.getElementById("audioPlayer"),eqBars=document.querySelectorAll(".eq-bar");
const stationList=document.getElementById("stationList");

function updateDisplay(freq){
 freqDisplay.innerText=freq.toFixed(1)+" MHz";
 scaleNeedle.style.left=(((freq-minFreq)/(maxFreq-minFreq))*100)+"%";
 document.querySelectorAll(".station-item").forEach(x=>x.classList.toggle("current",Number(x.dataset.freq)===Number(freq)));
}
function renderList(){
 stationList.innerHTML=stations.map(s=>`<div class="station-item" data-freq="${s.freq}"><span>${s.freq.toFixed(1)}</span><span>${s.name}${s.key?"":" · stream yok"}</span></div>`).join("");
}
function closestStation(){
 return stations.reduce((a,b)=>Math.abs(b.freq-currentFreq)<Math.abs(a.freq-currentFreq)?b:a);
}
async function playStation(station){
 if(!station.key){
   audio.pause(); audio.removeAttribute("src"); audio.load();
   stationDisplay.innerText=station.name;
   statusText.innerText="FREKANS VAR · YAYIN ADRESİ HENÜZ EKLENMEDİ";
   return;
 }
 stationDisplay.innerText=station.name;
 statusText.innerText="Bağlanıyor: "+station.name;
 audio.pause(); audio.removeAttribute("src"); audio.load();
 audio.src=PROXY_BASE+encodeURIComponent(station.key);
 audio.volume=Number(volSlider.value);
 try{
   await audio.play();
   statusText.innerText="YAYINDA: "+station.name;
 }catch(e){
   console.error(e);
   statusText.innerText="YAYIN BAŞLATILAMADI · PROXY/KAYNAK";
 }
}
function tune(){
 const s=closestStation();
 currentFreq=s.freq; updateDisplay(currentFreq); playStation(s);
}
let dragging=false;
function handleMove(x){
 if(!isPoweredOn)return;
 const r=scaleContainer.getBoundingClientRect();
 let p=Math.max(0,Math.min(1,(x-r.left)/r.width));
 currentFreq=minFreq+p*(maxFreq-minFreq); updateDisplay(currentFreq);
 stationDisplay.innerText="PARAZİT...";
 statusText.innerText="Frekans Aranıyor...";
}
function endDrag(){if(!dragging||!isPoweredOn)return;dragging=false;tune();}
scaleContainer.addEventListener("pointerdown",e=>{dragging=true;scaleContainer.setPointerCapture(e.pointerId);handleMove(e.clientX)});
scaleContainer.addEventListener("pointermove",e=>{if(dragging)handleMove(e.clientX)});
scaleContainer.addEventListener("pointerup",endDrag);
scaleContainer.addEventListener("pointercancel",endDrag);
powerBtn.onclick=()=>{
 isPoweredOn=!isPoweredOn;
 if(isPoweredOn){powerBtn.classList.add("active");powerBtn.innerText="GÜÇ: AÇIK";tune();}
 else{powerBtn.classList.remove("active");powerBtn.innerText="GÜÇ: KAPALI";audio.pause();audio.removeAttribute("src");audio.load();stationDisplay.innerText="RADYO KAPALI";statusText.innerText="Güç kapalı";}
};
volSlider.addEventListener("input",e=>audio.volume=Number(e.target.value));
audio.addEventListener("waiting",()=>{if(isPoweredOn)statusText.innerText="Yayın tamponlanıyor..."});
audio.addEventListener("stalled",()=>{if(isPoweredOn)statusText.innerText="Yayın durdu · tekrar deneniyor..."});
audio.addEventListener("error",()=>{if(isPoweredOn)statusText.innerText="Yayın hatası · kaynak kontrol edilmeli"});
renderList();updateDisplay(currentFreq);
</script>
</body>
</html>
