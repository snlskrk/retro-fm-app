<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RetroFM · Istanbul Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Share Tech Mono', monospace; background: #070402; display: flex; justify-content: center; align-items: center; }

        .radio-cabinet {
            width: 95%; max-width: 430px;
            background: linear-gradient(145deg, #421d0a, #1c0a03);
            border: 10px solid #0a0402; border-radius: 24px; padding: 20px;
            box-shadow: 0 35px 80px rgba(0,0,0,0.95), inset 0 0 35px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 14px; position: relative;
        }

        .brass-badge {
            position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(to bottom, #f3e5ab, #b8860b); color: #0f0703;
            font-family: 'Special Elite', cursive; font-size: 0.75rem; padding: 2px 18px;
            border-radius: 4px; border: 2px solid #2b1206; box-shadow: 0 4px 10px rgba(0,0,0,0.7);
            letter-spacing: 2px;
        }

        .main-display {
            background: #030803; border: 3px solid #0e210e; border-radius: 12px;
            padding: 14px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: inset 0 0 25px rgba(0,255,0,0.15);
        }

        .freq-display { font-size: 2.3rem; color: #33ff33; text-align: center; text-shadow: 0 0 12px rgba(51,255,51,0.6); }
        .station-display { font-size: 0.85rem; color: #ffb703; text-align: center; letter-spacing: 1px; min-height: 18px; }

        .vu-meter-box {
            width: 100%; height: 60px; background: #ebdcb9; border: 3px solid #1a0c04;
            border-radius: 6px; position: relative; overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            display: flex; justify-content: center; align-items: flex-end;
        }
        .vu-scale {
            position: absolute; top: 6px; width: 80%; display: flex; justify-content: space-between;
            font-size: 0.55rem; color: #4a3011; font-weight: bold;
        }
        .vu-needle {
            position: absolute; bottom: -5px; left: 50%; width: 2px; height: 52px;
            background: #a30000; transform-origin: bottom center;
            transform: translateX(-50%) rotate(-35deg); transition: transform 0.08s ease-out;
            z-index: 5; box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        .scale-container {
            width: 100%; background: #140904; border: 3px solid #2e170b; border-radius: 8px;
            padding: 12px 10px; position: relative; cursor: ew-resize; touch-action: none;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
        }
        .scale-bar { position: relative; height: 22px; width: 100%; }
        .scale-line { position: absolute; top: 10px; left: 0; right: 0; height: 2px; background: #b8860b; }
        .scale-needle {
            position: absolute; top: 0px; width: 3px; height: 22px; background: #ff3333;
            box-shadow: 0 0 10px #ff3333; transform: translateX(-50%); transition: left 0.05s linear; z-index: 5;
        }
        .scale-labels { display: flex; justify-content: space-between; font-size: 0.6rem; color: #b09b85; margin-top: 4px; }

        .controls-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #140602; border: 2px solid #2e170b; border-radius: 10px; padding: 10px 16px;
        }

        .power-btn {
            background: #4a3008; border: 3px solid #f3e5ab; color: #f3e5ab;
            padding: 10px 20px; border-radius: 20px; font-family: 'Share Tech Mono', monospace;
            font-weight: bold; font-size: 0.8rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            transition: 0.2s; position: relative; z-index: 10;
        }
        .power-btn.active { background: #1a520c; border-color: #33ff33; color: #33ff33; box-shadow: 0 0 15px #33ff33; }

        .volume-control { display: flex; align-items: center; gap: 8px; color: #b09b85; font-size: 0.75rem; }
        .volume-slider {
            -webkit-appearance: none; width: 95px; height: 6px; background: #2e170b;
            border-radius: 3px; outline: none; border: 1px solid #4a3008;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
            background: linear-gradient(to bottom, #f3e5ab, #b8860b); cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .status-text { font-size: 0.65rem; color: #a39171; text-align: center; height: 14px; }
    </style>
</head>
<body>

    <div class="radio-cabinet">
        <div class="brass-badge">RETRO-FM · ISTANBUL</div>

        <div class="main-display">
            <div class="freq-display" id="freqDisplay">100.0 MHz</div>
            <div class="station-display" id="stationDisplay">RADYO KAPALI</div>

            <div class="vu-meter-box">
                <div class="vu-scale">
                    <span>-20</span><span>-10</span><span>-5</span><span>0</span><span>+3</span>
                </div>
                <div class="vu-needle" id="vuNeedle"></div>
            </div>
        </div>

        <div class="scale-container" id="scaleContainer">
            <div class="scale-bar" id="scaleBar">
                <div class="scale-line"></div>
                <div class="scale-needle" id="scaleNeedle" style="left: 50%;"></div>
            </div>
            <div class="scale-labels">
                <span>87.5</span><span>92.0</span><span>96.0</span><span>100.0</span><span>104.0</span><span>108.0</span>
            </div>
        </div>

        <div class="controls-row">
            <button class="power-btn" id="powerBtn">GÜÇ: KAPALI</button>
            <div class="volume-control">
                <span>SES</span>
                <input type="range" id="volSlider" class="volume-slider" min="0" max="1" step="0.05" value="0.8">
            </div>
        </div>

        <div class="status-text" id="statusText">Güç düğmesine basarak radyoyu açın</div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const PROXY_BASE = "https://retro-proxy-pt9j.onrender.com/stream?channel=";

        const stations = [
            { freq: 87.5, name: "TRT Radyo 1", key: "trt1", hls: true },
            { freq: 87.7, name: "Slow Türk", key: "slowturk", hls: false },
            { freq: 88.0, name: "TRT FM", key: "trtfm", hls: true },
            { freq: 89.0, name: "Joy Türk", key: "joyturk", hls: false },
            { freq: 89.2, name: "Alem FM", key: "alemfm", hls: true },
            { freq: 89.6, name: "Kafa Radyo", key: "kafaradyo", hls: false },
            { freq: 90.4, name: "Süper FM", key: "superfm", hls: false },
            { freq: 91.0, name: "Kral FM", key: "kralfm", hls: true },
            { freq: 92.0, name: "Kral Pop", key: "kralpop", hls: true },
            { freq: 92.6, name: "CNN Türk Radyo", key: "cnn", hls: true },
            { freq: 93.6, name: "Radyo D", key: "radyod", hls: true },
            { freq: 96.2, name: "Metro FM", key: "metrofm", hls: false },
            { freq: 96.8, name: "NTV Radyo", key: "ntv", hls: true },
            { freq: 98.4, name: "Best FM", key: "bestfm", hls: false },
            { freq: 99.8, name: "PowerTürk", key: "powerturk", hls: false },
            { freq: 100.0, name: "Power FM", key: "powerfm", hls: false },
            { freq: 100.2, name: "Power Pop", key: "powerpop", hls: false },
            { freq: 100.6, name: "Joy FM", key: "joyfm", hls: false },
            { freq: 101.0, name: "Virgin Radio", key: "virgin", hls: false }
        ];

        const minFreq = 87.5;
        const maxFreq = 108.0;
        let currentFreq = 100.0;
        let isPoweredOn = false;
        let hlsInstance = null;

        const powerBtn = document.getElementById('powerBtn');
        const freqDisplay = document.getElementById('freqDisplay');
        const stationDisplay = document.getElementById('stationDisplay');
        const statusText = document.getElementById('statusText');
        const scaleContainer = document.getElementById('scaleContainer');
        const scaleNeedle = document.getElementById('scaleNeedle');
        const volSlider = document.getElementById('volSlider');
        const audio = document.getElementById('audioPlayer');
        const vuNeedle = document.getElementById('vuNeedle');

        let audioCtx = null;
        let noiseGain = null;

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function initNoise() {
            initAudioContext();
            if (!noiseGain) {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;

                noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0;

                noiseNode.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noiseNode.start();
            }
        }

        function setNoiseVolume(vol) {
            if (noiseGain && audioCtx) noiseGain.gain.setValueAtTime(vol, audioCtx.currentTime);
        }

        setInterval(() => {
            if (isPoweredOn && !audio.paused) {
                let randomAngle = -20 + Math.random() * 45;
                vuNeedle.style.transform = `translateX(-50%) rotate(${randomAngle}deg)`;
            } else {
                vuNeedle.style.transform = `translateX(-50%) rotate(-35deg)`;
            }
        }, 100);

        function updateDisplay(freq) {
            freqDisplay.innerText = freq.toFixed(1) + " MHz";
            let percent = ((freq - minFreq) / (maxFreq - minFreq)) * 100;
            scaleNeedle.style.left = percent + "%";
        }

        function stopAudio() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
        }

        function playStation(station) {
            stopAudio();

            if (!station || !station.key) {
                statusText.innerText = "FREKANS BOS · YAYIN YOK";
                stationDisplay.innerText = station ? station.name : "BOŞ FREKANS";
                return;
            }

            statusText.innerText = "BAĞLANIYOR...";
            stationDisplay.innerText = station.name;

            const streamUrl = PROXY_BASE + station.key;

            if (station.hls && Hls.isSupported()) {
                hlsInstance = new Hls({ enableWorker: true });
                hlsInstance.loadSource(streamUrl);
                hlsInstance.attachMedia(audio);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    audio.play().then(() => {
                        statusText.innerText = "YAYINDA";
                    }).catch(err => {
                        statusText.innerText = "OYNATMA ENGELİ";
                    });
                });
                hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) statusText.innerText = "HLS BAĞLANTI HATASI";
                });
            } else {
                audio.src = streamUrl;
                audio.volume = volSlider.value;
                audio.play().then(() => {
                    statusText.innerText = "YAYINDA";
                }).catch(err => {
                    statusText.innerText = "BAĞLANTI HATASI";
                });
            }
        }

        volSlider.addEventListener('input', (e) => { audio.volume = e.target.value; });

        let isDragging = false;

        function handleMove(clientX) {
            if (!isPoweredOn) return;
            const rect = scaleContainer.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            if (percent < 0) percent = 0; if (percent > 1) percent = 1;

            currentFreq = minFreq + (percent * (maxFreq - minFreq));
            updateDisplay(currentFreq);

            audio.volume = 0.02;
            setNoiseVolume(0.15);
            statusText.innerText = "ARANIYOR...";
            stationDisplay.innerText = "PARAZİT...";
        }

        function handleEnd() {
            if (!isDragging || !isPoweredOn) return;
            isDragging = false;

            setNoiseVolume(0);
            audio.volume = volSlider.value;

            let closest = stations.reduce((prev, curr) => 
                Math.abs(curr.freq - currentFreq) < Math.abs(prev.freq - currentFreq) ? curr : prev
            );

            currentFreq = closest.freq;
            updateDisplay(currentFreq);
            playStation(closest);
        }

        scaleContainer.addEventListener('mousedown', (e) => { isDragging = true; initNoise(); handleMove(e.clientX); });
        window.addEventListener('mousemove', (e) => { if (isDragging) handleMove(e.clientX); });
        window.addEventListener('mouseup', () => { if (isDragging) handleEnd(); });

        scaleContainer.addEventListener('touchstart', (e) => { isDragging = true; initNoise(); handleMove(e.touches[0].clientX); });
        window.addEventListener('touchmove', (e) => { if (isDragging) handleMove(e.touches[0].clientX); });
        window.addEventListener('touchend', () => { if (isDragging) handleEnd(); });

        powerBtn.onclick = () => {
            isPoweredOn = !isPoweredOn;
            initAudioContext();
            initNoise();

            if (isPoweredOn) {
                powerBtn.classList.add('active');
                powerBtn.innerText = "GÜÇ: AÇIK";
                let initialStation = stations.reduce((prev, curr) => 
                    Math.abs(curr.freq - currentFreq) < Math.abs(prev.freq - currentFreq) ? curr : prev
                );
                currentFreq = initialStation.freq;
                updateDisplay(currentFreq);
                playStation(initialStation);
            } else {
                powerBtn.classList.remove('active');
                powerBtn.innerText = "GÜÇ: KAPALI";
                stopAudio();
                setNoiseVolume(0);
                stationDisplay.innerText = "RADYO KAPALI";
                statusText.innerText = "Güç kapalı";
            }
        };

        updateDisplay(currentFreq);
    </script>
</body>
</html>
