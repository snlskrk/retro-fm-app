<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RetroFM · Universal Player</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Special+Elite&display=swap" rel="stylesheet">
    <!-- M3U8 / HLS Yayın Desteği İçin Kütüphane -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Share Tech Mono', monospace; background: #0c0806; display: flex; justify-content: center; align-items: center; }

        .radio-panel {
            width: 94%; max-width: 410px; background: linear-gradient(145deg, #2b1206, #140702);
            border: 8px solid #050201; border-radius: 20px; padding: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.7);
            display: flex; flex-direction: column; gap: 12px; position: relative;
        }

        .brand-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #3d1a08; padding-bottom: 8px; }
        .logo { font-family: 'Special Elite', cursive; color: #f3e5ab; font-size: 1rem; letter-spacing: 2px; }
        
        .power-btn {
            background: #4a3008; border: 3px solid #f3e5ab; color: #f3e5ab;
            padding: 8px 16px; border-radius: 20px; font-family: 'Share Tech Mono', monospace;
            font-weight: bold; font-size: 0.75rem; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .power-btn.active { background: #1a520c; border-color: #33ff33; color: #33ff33; box-shadow: 0 0 15px #33ff33; }

        .screen-box { background: #030703; border: 3px solid #0f1f0f; border-radius: 8px; padding: 10px; text-align: center; box-shadow: inset 0 0 15px rgba(0,255,0,0.15); }
        .freq-text { font-size: 2rem; color: #33ff33; text-shadow: 0 0 10px rgba(51,255,51,0.6); }
        .station-text { font-size: 0.8rem; color: #ffb703; margin-top: 2px; letter-spacing: 1px; }

        .scale-container {
            width: 100%; background: #120803; border: 3px solid #2b180d; border-radius: 8px;
            padding: 10px 8px; position: relative; cursor: ew-resize; touch-action: none;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);
        }
        .scale-bar { position: relative; height: 18px; width: 100%; }
        .scale-line { position: absolute; top: 8px; left: 0; right: 0; height: 2px; background: #b8860b; }
        .scale-needle {
            position: absolute; top: 0px; width: 3px; height: 18px; background: #ff3333;
            box-shadow: 0 0 8px #ff3333; transform: translateX(-50%); transition: left 0.05s linear; z-index: 5;
        }
        .scale-labels { display: flex; justify-content: space-between; font-size: 0.55rem; color: #b09b85; margin-top: 4px; }

        .vu-meter { width: 100%; height: 22px; background: #dcd0ba; border: 2px solid #0f0703; border-radius: 4px; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: flex-end; }
        .vu-needle { position: absolute; bottom: 2px; left: 50%; width: 1.5px; height: 16px; background: #8b0000; transform-origin: bottom center; transform: translateX(-50%) rotate(-25deg); transition: transform 0.1s ease; }

        .status-footer { font-size: 0.65rem; color: #a39171; text-align: center; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="radio-panel">
        <div class="brand-header">
            <div class="logo">RETRO-FM</div>
            <button class="power-btn" id="powerBtn">GÜÇ: KAPALI</button>
        </div>

        <div class="screen-box">
            <div class="freq-text" id="freqDisplay">100.0 MHz</div>
            <div class="station-text" id="stationDisplay">RADYO KAPALI</div>
        </div>

        <div class="vu-meter">
            <div class="vu-needle" id="vuNeedle"></div>
        </div>

        <div class="scale-container" id="scaleContainer">
            <div class="scale-bar" id="scaleBar">
                <div class="scale-line"></div>
                <div class="scale-needle" id="scaleNeedle" style="left: 50%;"></div>
            </div>
            <div class="scale-labels">
                <span>87.5</span><span>92.0</span><span>96.0</span><span>100.0</span><span>104.0</span><span>108.0</span>
            </div>
        </div>

        <div class="status-footer" id="statusText">Skalayı sürükleyerek kanal arayın</div>
    </div>

    <!-- Gizli Oynatıcı Elementi -->
    <audio id="audioPlayer"></audio>

    <script>
        const PROXY_URL = "https://retro-proxy-pt9j.onrender.com/stream?url=";

        const stations = [
            { freq: 87.7, name: "Slow Türk", url: "https://ssli.kralgrup.com/slowturk" },
            { freq: 89.0, name: "Joy Türk", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/JOY_TURKAAC_SC.aac" },
            { freq: 90.4, name: "Süper FM", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/SUPER_FMAAC_SC.aac" },
            { freq: 91.0, name: "Kral FM", url: "https://ssli.kralgrup.com/kralfm" },
            { freq: 92.0, name: "Kral Pop", url: "https://ssli.kralgrup.com/kralpop" },
            { freq: 95.8, name: "Show Radyo", url: "https://icast.showradyo.com.tr/showradyo" },
            { freq: 96.2, name: "Metro FM", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/METRO_FMAAC_SC.aac" },
            { freq: 100.0, name: "Power FM", url: "https://icecast.powerfm.org/powerfm.mp3" },
            { freq: 100.6, name: "Joy FM", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/JOY_FMAAC_SC.aac" },
            { freq: 101.0, name: "Virgin Radio", url: "https://playerservices.streamtheworld.com/api/livestream-redirect/VIRGIN_RADIOAAC.aac" },
            { freq: 105.0, name: "Alem FM", url: "https://turkmedya.radyotvonline.net/alemfm/playlist.m3u8" },
            { freq: 108.0, name: "Power Türk", url: "https://icecast.powerfm.org/powerturk.mp3" }
        ];

        const minFreq = 87.5;
        const maxFreq = 108.0;
        let currentFreq = 100.0;
        let isPoweredOn = false;
        let hlsPlayer = null;

        const powerBtn = document.getElementById('powerBtn');
        const freqDisplay = document.getElementById('freqDisplay');
        const stationDisplay = document.getElementById('stationDisplay');
        const statusText = document.getElementById('statusText');
        const scaleContainer = document.getElementById('scaleContainer');
        const scaleNeedle = document.getElementById('scaleNeedle');
        const vuNeedle = document.getElementById('vuNeedle');
        const audio = document.getElementById('audioPlayer');

        let audioCtx = null;
        let noiseGain = null;

        function initNoise() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (!noiseGain) {
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noiseNode = audioCtx.createBufferSource();
                noiseNode.buffer = buffer;
                noiseNode.loop = true;

                noiseGain = audioCtx.createGain();
                noiseGain.gain.value = 0;

                noiseNode.connect(noiseGain);
                noiseGain.connect(audioCtx.destination);
                noiseNode.start();
            }
        }

        function setNoiseVolume(vol) {
            if (noiseGain && audioCtx) noiseGain.gain.setValueAtTime(vol, audioCtx.currentTime);
        }

        function updateDisplay(freq) {
            freqDisplay.innerText = freq.toFixed(1) + " MHz";
            let percent = ((freq - minFreq) / (maxFreq - minFreq)) * 100;
            scaleNeedle.style.left = percent + "%";
        }

        function playStation(station) {
            statusText.innerText = "Bağlanıyor: " + station.name;
            stationDisplay.innerText = station.name;

            // Önceki yayın akışını ve HLS nesnesini temizle
            if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
            audio.pause();
            audio.src = "";

            const targetUrl = PROXY_URL + encodeURIComponent(station.url);

            // M3U8 / HLS Yayını mı Kontrol Et
            if (station.url.includes('.m3u8') && Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(targetUrl);
                hlsPlayer.attachMedia(audio);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    audio.play().then(() => statusText.innerText = "YAYINDA: " + station.name);
                });
                hlsPlayer.on(Hls.Events.ERROR, () => {
                    statusText.innerText = "Yayın Başlatılamadı";
                });
            } else {
                // Standart MP3 / AAC Akışı
                audio.src = targetUrl;
                audio.play().then(() => {
                    statusText.innerText = "YAYINDA: " + station.name;
                }).catch(() => {
                    statusText.innerText = "Yayın Başlatılamadı";
                });
            }
        }

        let isDragging = false;

        function handleMove(clientX) {
            if (!isPoweredOn) return;
            const rect = scaleContainer.getBoundingClientRect();
            let percent = (clientX - rect.left) / rect.width;
            if (percent < 0) percent = 0; if (percent > 1) percent = 1;

            currentFreq = minFreq + (percent * (maxFreq - minFreq));
            updateDisplay(currentFreq);

            audio.volume = 0.05;
            setNoiseVolume(0.2);
            statusText.innerText = "Frekans Aranıyor...";
            stationDisplay.innerText = "PARAZİT...";
        }

        function handleEnd() {
            if (!isDragging || !isPoweredOn) return;
            isDragging = false;

            setNoiseVolume(0);
            audio.volume = 1.0;

            let closest = stations.reduce((prev, curr) => 
                Math.abs(curr.freq - currentFreq) < Math.abs(prev.freq - currentFreq) ? curr : prev
            );

            currentFreq = closest.freq;
            updateDisplay(currentFreq);
            playStation(closest);
        }

        scaleContainer.addEventListener('mousedown', (e) => { isDragging = true; initNoise(); handleMove(e.clientX); });
        window.addEventListener('mousemove', (e) => { if (isDragging) handleMove(e.clientX); });
        window.addEventListener('mouseup', () => { if (isDragging) handleEnd(); });

        scaleContainer.addEventListener('touchstart', (e) => { isDragging = true; initNoise(); handleMove(e.touches[0].clientX); });
        window.addEventListener('touchmove', (e) => { if (isDragging) handleMove(e.touches[0].clientX); });
        window.addEventListener('touchend', () => { if (isDragging) handleEnd(); });

        setInterval(() => {
            if (isPoweredOn) {
                let angle = -20 + (Math.random() * 40);
                vuNeedle.style.transform = `translateX(-50%) rotate(${angle}deg)`;
            } else {
                vuNeedle.style.transform = `translateX(-50%) rotate(-25deg)`;
            }
        }, 100);

        powerBtn.onclick = () => {
            isPoweredOn = !isPoweredOn;
            initNoise();

            if (isPoweredOn) {
                powerBtn.classList.add('active');
                powerBtn.innerText = "GÜÇ: AÇIK";
                let initialStation = stations.reduce((prev, curr) => 
                    Math.abs(curr.freq - currentFreq) < Math.abs(prev.freq - currentFreq) ? curr : prev
                );
                currentFreq = initialStation.freq;
                updateDisplay(currentFreq);
                playStation(initialStation);
            } else {
                powerBtn.classList.remove('active');
                powerBtn.innerText = "GÜÇ: KAPALI";
                if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
                audio.pause(); audio.src = "";
                setNoiseVolume(0);
                stationDisplay.innerText = "RADYO KAPALI";
                statusText.innerText = "Güç kapalı";
            }
        };

        updateDisplay(currentFreq);
    </script>
</body>
</html>
