<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RetroFM · Master</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* [Buradaki CSS kodların aynı kalabilir, tasarımını bozmayalım] */
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Share Tech Mono', monospace; background: #050302; display: flex; justify-content: center; align-items: center; }
        .radio-cabinet { width: 95%; max-width: 420px; background: linear-gradient(135deg, #3d1a08, #1a0a03); border: 10px solid #0a0402; border-radius: 28px; padding: 18px; box-shadow: 0 30px 70px rgba(0,0,0,0.95); display: flex; flex-direction: column; gap: 12px; }
        .screen-box { background: #020802; border: 3px solid #0d1f0f; border-radius: 10px; padding: 12px; text-align: center; }
        .freq-display { font-size: 2.2rem; color: #33ff33; }
        .power-btn { background: #4a3008; border: 3px solid #f3e5ab; color: #f3e5ab; padding: 8px 16px; border-radius: 20px; cursor: pointer; }
        .power-btn.active { background: #1a520c; border-color: #33ff33; color: #33ff33; }
    </style>
</head>
<body>
    <div class="radio-cabinet">
        <div class="screen-box">
            <div class="freq-display" id="freqDisplay">100.0 MHz</div>
            <div id="stationDisplay">RADYO KAPALI</div>
        </div>
        <button class="power-btn" id="powerBtn">GÜÇ: KAPALI</button>
        <div id="statusText">Güç düğmesine basın</div>
    </div>
    <audio id="audioPlayer"></audio>
    <script>
        const PROXY_BASE = "https://retro-proxy-pt9j.onrender.com/stream?channel=";
        const stations = [
            { freq: 87.7, name: "Slow Türk", key: "slowturk" },
            { freq: 91.0, name: "Kral FM", key: "kralfm" },
            { freq: 92.0, name: "Kral Pop", key: "kralpop" },
            { freq: 100.0, name: "Power FM", key: "powerfm" },
            { freq: 108.0, name: "Power Türk", key: "powerturk" }
        ];

        // [Buraya handleMove, playStation vb. fonksiyonlarını önceki koddan ekleyebilirsin]
        // Kilit nokta playStation fonksiyonunda:
        function playStation(station) {
            if(!station.key) return;
            const url = PROXY_BASE + station.key;
            if(Hls.isSupported() && url.includes('m3u8')) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(document.getElementById('audioPlayer'));
            } else {
                document.getElementById('audioPlayer').src = url;
            }
            document.getElementById('audioPlayer').play();
        }
    </script>
</body>
</html>
