<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroFM Master</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #050302; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: white; }
        .radio { background: #3d1a08; padding: 20px; border-radius: 20px; text-align: center; border: 5px solid #0a0402; }
        #powerBtn { z-index: 999; padding: 15px 30px; font-size: 1.2rem; cursor: pointer; background: #4a3008; color: white; border: none; }
        .active { background: #1a520c !important; }
        #statusText { margin-top: 10px; font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>
    <div class="radio">
        <div id="freqDisplay">100.0 MHz</div>
        <button id="powerBtn">GÜÇ: KAPALI</button>
        <div id="statusText">Düğmeye basın</div>
    </div>
    <audio id="audioPlayer"></audio>

    <script>
        const PROXY_BASE = "https://retro-proxy-pt9j.onrender.com/stream?channel=";
        const audio = document.getElementById('audioPlayer');
        const powerBtn = document.getElementById('powerBtn');
        const statusText = document.getElementById('statusText');
        let isPoweredOn = false;

        powerBtn.addEventListener('click', async () => {
            // Tarayıcı kuralı: Kullanıcı etkileşimi olmadan ses başlamaz
            if (audio.paused) {
                try {
                    isPoweredOn = true;
                    powerBtn.classList.add('active');
                    powerBtn.innerText = "GÜÇ: AÇIK";
                    statusText.innerText = "Bağlanıyor...";
                    
                    audio.src = PROXY_BASE + "kralfm"; // Varsayılan kanal
                    await audio.play();
                    statusText.innerText = "YAYINDA";
                } catch(e) {
                    statusText.innerText = "HATA: " + e.message;
                }
            } else {
                isPoweredOn = false;
                powerBtn.classList.remove('active');
                powerBtn.innerText = "GÜÇ: KAPALI";
                audio.pause();
                statusText.innerText = "Güç kapalı";
            }
        });
    </script>
</body>
</html>
